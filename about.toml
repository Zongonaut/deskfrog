# Config for `cargo-about` (https://crates.io/crates/cargo-about), which
# generates THIRD-PARTY-LICENSES.txt to satisfy the notice-preservation terms
# of the MIT/Apache-2.0-licensed dependencies in the release binary.
#
# To regenerate after a dependency change:
#   1. cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt
#   2. Delete the resulting self-referential "GNU General Public License
#      v3.0 only" section (DeskFrog's own license, already covered by
#      LICENSE, not something this file needs to also carry) -- both its
#      line in the "Overview" list near the top, and its full section
#      further down. The `[deskfrog]` override below exists only so step 1
#      doesn't fail; it doesn't stop that section from being generated.
#   3. If distributing a Windows release build, copy the refreshed file into
#      dist/DeskFrog-*-windows-x64/ and re-zip.

ignore-dev-dependencies = true
ignore-build-dependencies = true

accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
]

[deskfrog]
accepted = ["GPL-3.0-only"]
