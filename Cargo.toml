[package]
name = "deskfrog"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
swash = "0.2.10"
toml = "1.1.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Foundation", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["allow-unsafe-code", "shape", "randr"] }
ksni = "0.3"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
image = "0.25.10"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
